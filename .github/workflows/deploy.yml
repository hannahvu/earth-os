name: Deploy ingest job

# Builds the ingest image and deploys it to the Cloud Run Job that
# Cloud Scheduler triggers hourly. Runs on every push to main that
# touches code the job uses.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - .python-version
      - models/**
      - sources/**
      - apps/bigquery/**
      - metrics/**
      - flows/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # OIDC token for keyless GCP auth (Workload Identity Federation)

env:
  PROJECT: earth-os-511902
  REGION: us-central1
  JOB: earthos-ingest
  IMAGE: us-central1-docker.pkg.dev/earth-os-511902/earthos/ingest
  WIF_PROVIDER: projects/668925653132/locations/global/workloadIdentityPools/github/providers/earth-os
  DEPLOYER_SA: earthos-deployer@earth-os-511902.iam.gserviceaccount.com
  RUNTIME_SA: earthos-ingest@earth-os-511902.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet
          docker build -t ${IMAGE}:${GITHUB_SHA} .
          docker push ${IMAGE}:${GITHUB_SHA}

      - name: Deploy Cloud Run Job
        run: |
          gcloud run jobs deploy ${JOB} \
            --project=${PROJECT} \
            --region=${REGION} \
            --image=${IMAGE}:${GITHUB_SHA} \
            --service-account=${RUNTIME_SA} \
            --set-env-vars=GCP_PROJECT=${PROJECT} \
            --set-secrets=EIA_API_KEY=eia-api-key:latest \
            --cpu=1 \
            --memory=2Gi \
            --task-timeout=20m \
            --max-retries=1 \
            --tasks=1
