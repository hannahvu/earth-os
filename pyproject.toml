[project]
name = "earthos"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "uvicorn>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sources", "models", "apps"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "setuptools<75",
]
